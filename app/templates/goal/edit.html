{% extends "base.html" %}
{% block title %}Edit Goal — WalletWizzard{% endblock %}
{% block content %}
<div class="page-wrap" style="max-width:480px;">
  <div class="page-header"><h1>Edit goal</h1></div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" class="form-card">
    <div class="field">
      <label>Goal name</label>
      <input type="text" name="name" value="{{ goal.name }}" required/>
    </div>
    <div class="field">
      <label>Target amount ($)</label>
      <input type="number" name="target_amount" step="0.01" min="1" value="{{ goal.target_amount }}" required/>
    </div>
    <div class="field">
      <label>Saved so far ($)</label>
      <input type="number" name="saved_amount" step="0.01" min="0" value="{{ goal.saved_amount }}"/>
    </div>
    <div class="field">
      <label>Target months</label>
      <input type="number" name="target_months" min="1" value="{{ goal.target_months }}"/>
    </div>
    <div style="display:flex;gap:10px;margin-top:.5rem;">
      <button type="submit" class="btn-auth" style="flex:1;">Update</button>
      <a href="{{ url_for('goal.index') }}" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
