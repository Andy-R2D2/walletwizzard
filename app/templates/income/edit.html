{% extends "base.html" %}
{% block title %}Edit Income — WalletWizzard{% endblock %}
{% block content %}
<div class="page-wrap" style="max-width:480px;">
  <div class="page-header"><h1>Edit income</h1></div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" class="form-card">
    <div class="field">
      <label>Source</label>
      <input type="text" name="source" value="{{ income.source }}" required/>
    </div>
    <div class="field">
      <label>Amount ($)</label>
      <input type="number" name="amount" step="0.01" min="0.01" value="{{ income.amount }}" required/>
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" name="date" value="{{ income.date }}"/>
    </div>
    <div class="field">
      <label>Description (optional)</label>
      <input type="text" name="description" value="{{ income.description or '' }}"/>
    </div>
    <div style="display:flex;gap:10px;margin-top:.5rem;">
      <button type="submit" class="btn-auth" style="flex:1;">Update</button>
      <a href="{{ url_for('income.index') }}" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
