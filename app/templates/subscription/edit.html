{% extends "base.html" %}
{% block title %}Edit Subscription — WalletWizzard{% endblock %}
{% block content %}
<div class="page-wrap" style="max-width:480px;">
  <div class="page-header"><h1>Edit subscription</h1></div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" class="form-card">
    <div class="field">
      <label>Service name</label>
      <input type="text" name="name" value="{{ sub.name }}" required/>
    </div>
    <div class="field">
      <label>Amount ($)</label>
      <input type="number" name="amount" step="0.01" min="0.01" value="{{ sub.amount }}" required/>
    </div>
    <div class="field">
      <label>Billing cycle</label>
      <select name="billing">
        <option value="monthly" {% if sub.billing == 'monthly' %}selected{% endif %}>Monthly</option>
        <option value="yearly"  {% if sub.billing == 'yearly'  %}selected{% endif %}>Yearly</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:.5rem;">
      <button type="submit" class="btn-auth" style="flex:1;">Update</button>
      <a href="{{ url_for('subscription.index') }}" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
